  const POSTS_PER_PAGE = 6;
  let currentPage = 1;
  let activeCategory = 'All';

  function getFiltered() {
    return activeCategory === 'All' ? allPosts : allPosts.filter(p => p.category === activeCategory);
  }

  function renderPosts() {
    const filtered = getFiltered();
    const total = filtered.length;
    const totalPages = Math.ceil(total / POSTS_PER_PAGE);
    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const pagePosts = filtered.slice(start, start + POSTS_PER_PAGE);
    const end = Math.min(start + POSTS_PER_PAGE, total);

    document.getElementById('posts-count').textContent =
      `Showing ${start + 1}–${end} of ${total} article${total !== 1 ? 's' : ''}${activeCategory !== 'All' ? ' in "' + activeCategory + '"' : ''}`;

    document.getElementById('posts-grid').innerHTML = pagePosts.map(p => `
      <a href="/blog/${p.slug}/" class="blog-card">
        <img src="/images/blog/${p.slug}.jpg" alt="${p.title}" class="blog-card-img" loading="lazy">
        <div class="blog-card-body">
          <div class="blog-card-category">${p.category}</div>
          <div class="blog-card-title">${p.title}</div>
          <p class="blog-card-excerpt">${p.excerpt}</p>
          <div class="blog-card-meta"><span>${p.date}</span><span class="blog-meta-dot"></span><span>${p.readTime} min read</span></div>
        </div>
      </a>`).join('');

    renderPagination(total, totalPages);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPagination(total, totalPages) {
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }

    let html = `<button class="pag-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button>`;

    const delta = 1;
    const range = [];
    for (let i = Math.max(2, currentPage - delta); i <= Math.min(totalPages - 1, currentPage + delta); i++) range.push(i);
    if (range.length > 0 && range[0] > 2) html += `<button class="pag-btn pag-num ${currentPage===1?'active':''}" onclick="goPage(1)">1</button><span class="pag-ellipsis">…</span>`;
    else html += `<button class="pag-btn pag-num ${currentPage===1?'active':''}" onclick="goPage(1)">1</button>`;

    range.forEach(i => {
      html += `<button class="pag-btn pag-num ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    });

    if (range.length > 0 && range[range.length-1] < totalPages - 1) html += `<span class="pag-ellipsis">…</span><button class="pag-btn pag-num ${currentPage===totalPages?'active':''}" onclick="goPage(${totalPages})">${totalPages}</button>`;
    else html += `<button class="pag-btn pag-num ${currentPage===totalPages?'active':''}" onclick="goPage(${totalPages})">${totalPages}</button>`;

    html += `<button class="pag-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button>`;
    pag.innerHTML = html;
  }

  function goPage(page) {
    const filtered = getFiltered();
    const totalPages = Math.ceil(filtered.length / POSTS_PER_PAGE);
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderPosts();
  }

  document.getElementById('filter-bar').addEventListener('click', e => {
    const btn = e.target.closest('.blog-filter-btn');
    if (!btn) return;
    activeCategory = btn.dataset.cat;
    currentPage = 1;
    document.querySelectorAll('.blog-filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderPosts();
  });

  document.addEventListener('DOMContentLoaded', () => {
    initTemplate({ title: 'Blog' });
    renderPosts();
  });
  </script>
